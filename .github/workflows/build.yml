name: build

# Builds SecretSpace-Client-Installer.exe on a clean Windows runner with
# builder/build.py, the same script as SecretSpace Builder on a PC, then
# installs it, starts the app, and uninstalls it.
#
# A pull request or a push to main keeps the installer as a workflow
# artifact. A tag v<version> also makes a DRAFT release with the installer
# and SHA256SUMS.txt; it is published by hand once its notes are written,
# so a published release never changes and is never without its files
# (the app's update check reads the Latest release).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.13"
      - name: Build tools
        run: |
          python -m pip install -r requirements.txt nuitka==4.3.5
          # Pinned like Nuitka: a new Inno Setup can change the wizard's look.
          choco install innosetup --version 6.7.1 --allow-downgrade -y --no-progress
      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'builder'); import build; print(build.app_version(build.project_dir()))")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, sourceFiles/version.py $version"; exit 1; }
      - name: Build
        env:
          SECRETSPACE_BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
        run: python builder/build.py
      - name: Checksums
        shell: bash
        run: sha256sum SecretSpace-Client-Installer.exe | tee SHA256SUMS.txt

      - name: Install, start, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = "$env:LOCALAPPDATA\Programs\SecretSpace"
          Start-Process -Wait .\SecretSpace-Client-Installer.exe -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER'
          foreach ($f in 'SecretSpace.exe', 'installed', 'LICENSE.txt',
                         'SecretSpace-logo.png', 'Manrope-Regular.ttf') {
            if (-not (Test-Path "$app\$f")) { throw "not installed: $f" }
          }

          # A missing module or DLL ends the app within a second or two;
          # still running after 15 s means it got as far as its window.
          $p = Start-Process "$app\SecretSpace.exe" -PassThru
          Start-Sleep 15
          if ($p.HasExited) { throw "SecretSpace exited at start (code $($p.ExitCode))" }
          "SecretSpace ran for 15 s: $($p.MainWindowTitle)"
          Stop-Process -Id $p.Id -Force

          # The uninstaller copies itself to %TEMP% and exits at once, so
          # wait for the program to be gone instead.
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES'
          foreach ($try in 1..60) {
            if (-not (Test-Path "$app\SecretSpace.exe")) { break }
            Start-Sleep 1
          }
          if (Test-Path "$app\SecretSpace.exe") { throw "not uninstalled" }
          "installed, started, uninstalled"

      - uses: actions/upload-artifact@v4
        with:
          name: SecretSpace-Client-Installer
          path: |
            SecretSpace-Client-Installer.exe
            SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installer
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SecretSpace-Client-Installer
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          sha256sum -c SHA256SUMS.txt
          if draft=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null); then
            # A re-run may replace the files of a draft, never of a release
            # people may already have downloaded.
            [ "$draft" = true ] || { echo "$TAG is already published"; exit 1; }
            gh release upload "$TAG" SecretSpace-Client-Installer.exe SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" --draft --verify-tag \
              --title "SecretSpace for Windows ${TAG#v}" \
              --notes "Built by the build workflow from $TAG. Release notes to follow." \
              SecretSpace-Client-Installer.exe SHA256SUMS.txt
          fi

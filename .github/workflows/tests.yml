name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    # Windows, because that is what SecretSpace ships for: the paths, the
    # installer marker and the tkinter build all match what users run.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Every source module imports
        # PyInstaller builds a broken exe rather than failing when a module
        # is missing, so check the same thing the builder checks.
        run: python -c "import sys; sys.path.insert(0, 'sourceFiles'); import gui"
      - name: Run the tests
        run: python -m pytest -q
